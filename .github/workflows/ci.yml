name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
      - name: Sync
        run: uv sync --extra dev
      - name: Test
        run: uv run pytest -q
      - name: Mechanics benchmark
        run: uv run python -m benchmark.run --out reports/
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}
          path: reports/
